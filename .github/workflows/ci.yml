name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # historique complet pour vérifier les commits de la PR
      - uses: pnpm/action-setup@v4 # version lue dans `packageManager`
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: node scripts/check-commit.ts --range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - run: pnpm check # conventions, types, lint, formatage, tests
      - run: pnpm build
        env:
          # Le build lit le contenu en base (src/db/queries.ts).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
